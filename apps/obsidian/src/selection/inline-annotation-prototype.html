<!DOCTYPE html>
<!--
  PROTOTYPE —— Issue #3「极简选区批注弹框 · 精准复刻 Quick Ask 风格」
  1:1 对照仓库真实组件样式与尺寸：
    - QuickAskOverlay.tsx: width=min(420, host-24), offset=6px, shadow-lg, fade-in 0.2s
    - QuickAskPanel.tsx: rounded-lg, border-border, bg-primary, 16px drag bar (64x5px pill), right-2 top-1 X
    - QuickAskInput.tsx: px-3 pt-2 pb-1 外壳 + min-h-12 (48px) max-h-48 px-1 py-2 text-sm 输入区
    - QuickAskFooter.tsx: border-t border-border px-3 py-1.5，左右布局，h-7 (28px) 按钮
    - AgentChat (右侧): 复刻用户截图暖米纸主题、Auto 红框、4.4 笔记 Current + 推导 L228 徽章样式
  交互规则（已确认最简首版）：
    - Selection Toolbar 双按钮（仅编辑视图）：Add to Copilot（静默引用） | Annotate（弹批注框）
    - 点 Annotate 只弹窗、不添加徽章；输入非空点 Done / Enter 才添加到输入框并把焦点还给笔记
    - 输入框上方徽章外观与 tooltip 与现有完全一致，无批注标记、无预览、点击无响应
    - 笔记内无额外行高亮，仅在弹窗打开期间保留 Quick Ask 同款选中区底色
    - 空主输入框时，只要有引用附带了批注指令即可直接发送
-->

  .qa-content-editable {

  .qa-footer {

  .qa-ghost-select {

  /* 图标主按钮（QuickAsk 原版 Send） */
  .qa-btn-primary-icon {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: var(--radius-m);
    background: var(--interactive-accent);

  /* 打磨后的 Cancel / Done 按钮体系（统一 28px 高度、光学对齐、克制微阴影与干净禁用态） */
  .qa-action-btn {
    height: 28px;
    padding: 0 11px;
    border-radius: var(--radius-m);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: -0.005em;

    justify-content: center;

  .qa-action-btn:active:not(:disabled) {
    transform: translateY(0.5px);

  .qa-action-btn:focus-visible {
    outline: 2px solid var(--interactive-accent);
    outline-offset: 1px;

    color: var(--text-muted);
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.035);

    background: var(--background-modifier-hover);
    border-color: var(--background-modifier-border-hover);
    color: var(--text-normal);
  }

  .qa-btn-cancel-ghost {
    padding: 0 9px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
  }
  .qa-btn-cancel-ghost:hover {
    background: var(--background-modifier-hover);
    color: var(--text-normal);
  }

  .qa-btn-done {
    padding: 0 12px;
    background: var(--interactive-accent);
    border: 1px solid color-mix(in srgb, var(--interactive-accent) 82%, #000);
    color: var(--text-on-accent);

  .qa-btn-done:hover:not(:disabled) {

  .qa-btn-done:disabled {
    background: var(--background-secondary);
    border-color: var(--background-modifier-border);
    color: var(--text-faint);

  [224, ""],
  [225, "$$ \\Delta_r G_m = \\sum_B \\nu_B \\mu_B \\le 0 $$"],
  [226, "其中 $\\nu_B$ 为化学计量数，反应物取负值，产物取正值。"],

};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

let toastTimer = null;
function toast(msg) {
  const el = $("#toast");

/* ---------------- 静态图标初始化 ---------------- */
$("#tab-file-icon").innerHTML = SVG.file;

/* ---------------- 焦点状态指示 ---------------- */
function setFocusPlace(place) {
  focusPlace = place;
  const pill = $("#focus-pill");
  if (place === "note") {
    pill.textContent = "焦点：笔记编辑器（已归还）";
    pill.className = "focus-indicator in-note";
  } else if (place === "popup") {
    pill.textContent = "焦点：批注弹框输入框";

  } else {
    pill.textContent = "焦点：Copilot Chat 输入框";
    pill.className = "focus-indicator";
  }
}

/* ---------------- 左侧笔记渲染（无额外持久行高亮） ---------------- */
function renderLines() {
  const container = $("#lines-container");
  container.innerHTML = "";
  const activeRange = popupTarget
    ? { start: popupTarget.start, end: popupTarget.end }
    : liveSel;

  for (const [n, text] of LINES) {
    const row = document.createElement("div");
    row.className = "cm-line";
    if (text.startsWith("##")) row.classList.add("is-heading");
    // 仅当前正在划选或当前打开弹框锚定的那几行有 SelectionHighlight，不保留 pinned 持久高亮
    if (activeRange && n >= activeRange.start && n <= activeRange.end) {
      row.classList.add("copilot-selection-highlight");
    }
    row.dataset.line = String(n);

    const gutter = document.createElement("span");
    gutter.className = "cm-gutter";
    gutter.textContent = String(n);

    const content = document.createElement("span");
    content.className = "cm-content";
    content.textContent = text || " ";

    row.appendChild(gutter);
    row.appendChild(content);
    container.appendChild(row);
  }
}

/* ---------------- Selection Toolbar 双按钮 ---------------- */
function renderToolbar() {
  const old = $("#sel-toolbar");
  if (old) old.remove();
  if (!liveSel || draggingSel || popupTarget) return;

  const lastRow = document.querySelector(`.cm-line[data-line="${liveSel.end}"]`);
  if (!lastRow) return;
  const hostRect = $("#cm-host").getBoundingClientRect();
  const rowRect = lastRow.getBoundingClientRect();

  const tb = document.createElement("div");
  tb.className = "selection-toolbar";
  tb.id = "sel-toolbar";
  tb.innerHTML =
    `<button type="button" data-act="quote">${SVG.quote}<span>Add to Copilot</span></button>` +
    `<span class="tb-sep"></span>` +
    `<button type="button" class="is-annotate" data-act="annotate">${SVG.annotate}<span>Annotate</span></button>`;

  tb.addEventListener("mousedown", (e) => e.stopPropagation());
  $("#cm-host").appendChild(tb);

  const top = Math.max(8, rowRect.bottom - hostRect.top + 6);
  const left = Math.max(12, Math.min(rowRect.left - hostRect.left + 44, hostRect.width - tb.offsetWidth - 14));
  tb.style.top = top + "px";
  tb.style.left = left + "px";

  tb.querySelector('[data-act="quote"]').addEventListener("click", () => {
    const start = liveSel.start;
    const end = liveSel.end;
    const key = `${NOTE_PATH}:${start}:${end}`;
    liveSel = null;
    anchorLine = null;
    pinExcerpt(key, start, end, contentFor(start, end), "");
    setFocusPlace("note");
    renderAll();
    toast("已静默固定为引用徽章");
  });

  tb.querySelector('[data-act="annotate"]').addEventListener("click", () => {
    const start = liveSel.start;
    const end = liveSel.end;
    const existing = pinned.find((p) => p.key === `${NOTE_PATH}:${start}:${end}`);
    liveSel = null;
    anchorLine = null;
    popupMode = "annotate";
    $("#view-anno").classList.add("active");
    $("#view-qa").classList.remove("active");
    popupDragPos = null;
    popupTarget = {
      start,
      end,
      content: contentFor(start, end),
      draft: existing?.instruction ?? "",
    };
    setFocusPlace("popup");
    renderAll();
  });
}

/* ---------------- 1:1 QuickAskOverlay 弹出与样式 ---------------- */
function renderPopupOverlay() {
  const root = $("#overlay-root");
  root.innerHTML = "";
  if (!popupTarget) return;

  const hostRect = $("#cm-host").getBoundingClientRect();
  const sizerRect = $("#cm-sizer").getBoundingClientRect();
  const topRow = document.querySelector(`.cm-line[data-line="${popupTarget.start}"]`);
  const bottomRow = document.querySelector(`.cm-line[data-line="${popupTarget.end}"]`);
  if (!topRow || !bottomRow) return;

  const topRect = topRow.getBoundingClientRect();
  const bottomRect = bottomRow.getBoundingClientRect();

  // 对照 QuickAskOverlay.tsx: PANEL_DEFAULT_WIDTH = 420, PANEL_MARGIN = 12, PANEL_OFFSET_Y = 6
  const width = Math.min(420, hostRect.width - 24);
  const overlay = document.createElement("div");
  overlay.className = "copilot-quick-ask-overlay";
  overlay.style.width = width + "px";

  if (popupMode === "annotate") {
    const hasText = popupTarget.draft.trim().length > 0;
    const cancelClass = buttonStyle === "ghost"
      ? "qa-action-btn qa-btn-cancel-ghost"
      : "qa-action-btn qa-btn-cancel-bordered";
    const cancelHtml = buttonStyle === "keycap"
      ? `<button type="button" class="${cancelClass}" id="anno-cancel" title="Cancel (Esc)"><span>Cancel</span><span class="qa-keycap">Esc</span></button>`
      : `<button type="button" class="${cancelClass}" id="anno-cancel" title="Cancel (Esc)">Cancel</button>`;
    const doneHtml = buttonStyle === "keycap"
      ? `<button type="button" class="qa-action-btn qa-btn-done" id="anno-done" ${hasText ? "" : "disabled"} title="Add instruction (Enter)"><span>Done</span><span class="qa-keycap">↵</span></button>`
      : `<button type="button" class="qa-action-btn qa-btn-done" id="anno-done" ${hasText ? "" : "disabled"} title="Add instruction (Enter)">${SVG.cornerReturn}<span>Done</span></button>`;

    overlay.innerHTML = `
      <div class="quick-ask-panel">
        <div class="qa-top-bar">
          <div class="qa-drag-handle" id="qa-drag"><div class="qa-drag-pill"></div></div>
          <button type="button" class="qa-close-btn" id="qa-close" title="Close">${SVG.x16}</button>
        </div>

        <div class="qa-input-outer">
          <div class="qa-input-box">
            <textarea
              id="anno-input"
              class="qa-content-editable"
              rows="2"
              aria-label="Annotation instruction input"
              placeholder="Add an instruction..."
            >${esc(popupTarget.draft)}</textarea>
          </div>
        </div>

        <div class="qa-footer">
          <div class="qa-footer-left">
            <span class="qa-anchor-hint">
              <span class="qa-anchor-loc">${esc(locLabel(popupTarget.start, popupTarget.end))}</span>
            </span>
          </div>
          <div class="qa-footer-right">
            ${cancelHtml}
            ${doneHtml}
          </div>
        </div>
      </div>
    `;
  } else {
    // 原版 Quick Ask 完整对照（含消息流、ModelSelector、Note checkbox、Clear、Send）
    overlay.innerHTML = `
      <div class="quick-ask-panel qa-orig">
        <div class="qa-top-bar">
          <div class="qa-drag-handle" id="qa-drag"><div class="qa-drag-pill"></div></div>
          <button type="button" class="qa-close-btn" id="qa-close" title="Close">${SVG.x16}</button>
        </div>

        <div class="qa-orig-messages">
          <div class="qa-orig-user">解释一下这个化学势判据</div>
          <div class="qa-orig-ai">等温等压下 $\\Delta_r G_m = \\sum_B \\nu_B \\mu_B$，小于 0 时反应自发。</div>
        </div>

        <div class="qa-input-outer">
          <div class="qa-input-box">
            <textarea class="qa-content-editable" id="anno-input" rows="2" placeholder="Ask a question... ">${esc(popupTarget.draft)}</textarea>
          </div>
        </div>

        <div class="qa-footer">
          <div class="qa-footer-left">
            <button type="button" class="qa-ghost-select">Claude Sonnet ${SVG.chevDown}</button>
            <label class="qa-checkbox-wrap"><input type="checkbox" checked /><span>Note</span></label>
          </div>
          <div class="qa-footer-right">
            <button type="button" class="qa-action-btn qa-btn-cancel-ghost" style="width:28px;padding:0" title="Clear conversation">${SVG.clear}</button>
            <button type="button" class="qa-btn-primary-icon" title="Send message">${SVG.send}</button>
          </div>
        </div>

        <div class="qa-resize-l"></div>
        <div class="qa-resize-r"></div>
      </div>
    `;
  }

  root.appendChild(overlay);

  // 复刻 QuickAskOverlay.tsx 的水平与上下翻转定位算法
  if (popupDragPos) {
    overlay.style.left = popupDragPos.left + "px";
    overlay.style.top = popupDragPos.top + "px";
  } else {
    const panelH = overlay.offsetHeight || 120;
    const isMultiLine = Math.abs(topRect.top - bottomRect.top) > 6;
    const contentLeft = Math.max(12, sizerRect.left - hostRect.left);
    const contentWidth = Math.min(sizerRect.width, hostRect.width - 24);
    let left = isMultiLine
      ? contentLeft + (contentWidth - width) / 2
      : topRect.left - hostRect.left + 40;
    left = Math.max(12, Math.min(left, hostRect.width - width - 12));

    const spaceBelow = hostRect.bottom - bottomRect.bottom - 12;
    const spaceAbove = topRect.top - hostRect.top - 12;
    let top;
    if (spaceBelow >= panelH + 6) {
      top = bottomRect.bottom - hostRect.top + 6;
    } else if (spaceAbove >= panelH + 6) {
      top = topRect.top - hostRect.top - 6 - panelH;
    } else {
      top = Math.max(12, hostRect.height - panelH - 12);
    }
    overlay.style.left = Math.round(left) + "px";
    overlay.style.top = Math.round(top) + "px";
  }

  bindPopupEvents(overlay);
}

function bindPopupEvents(overlay) {
  overlay.addEventListener("mousedown", (e) => e.stopPropagation());
  overlay.addEventListener("click", (e) => e.stopPropagation());

  // 拖拽移动（复刻 useDraggable）
  const dragEl = overlay.querySelector("#qa-drag");
  dragEl?.addEventListener("mousedown", (e) => {
    e.preventDefault();
    const hostRect = $("#cm-host").getBoundingClientRect();
    const rect = overlay.getBoundingClientRect();
    const sx = e.clientX;
    const sy = e.clientY;
    const baseL = rect.left - hostRect.left;
    const baseT = rect.top - hostRect.top;
    const move = (ev) => {
      const l = Math.max(8, Math.min(baseL + (ev.clientX - sx), hostRect.width - overlay.offsetWidth - 8));
      const t = Math.max(8, Math.min(baseT + (ev.clientY - sy), hostRect.height - overlay.offsetHeight - 8));
      popupDragPos = { left: l, top: t };
      overlay.style.left = l + "px";
      overlay.style.top = t + "px";
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });

  const closeCancel = () => {
    popupTarget = null;
    popupDragPos = null;
    setFocusPlace("note");
    renderAll();
  };

  overlay.querySelector("#qa-close")?.addEventListener("click", closeCancel);
  overlay.querySelector("#anno-cancel")?.addEventListener("click", closeCancel);

  const ta = overlay.querySelector("#anno-input");
  if (ta) {
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    // 复刻 QuickAskInput 自动随文本增高（min-h-12 到 max-h-48）
    const autoHeight = () => {
      ta.style.height = "auto";
      ta.style.height = Math.min(192, Math.max(48, ta.scrollHeight)) + "px";
    };
    autoHeight();

    ta.addEventListener("input", () => {
      if (!popupTarget) return;
      popupTarget.draft = ta.value;
      autoHeight();
      const doneBtn = overlay.querySelector("#anno-done");
      if (doneBtn) doneBtn.disabled = !ta.value.trim();
    });

    ta.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        e.stopPropagation();
        closeCancel();
        return;
      }
      if (popupMode === "annotate" && e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        commitAnnotation();
      }
    });
  }

  overlay.querySelector("#anno-done")?.addEventListener("click", commitAnnotation);
}

function commitAnnotation() {
  if (!popupTarget) return;
  const text = popupTarget.draft.trim();
  if (!text) return;

  const { start, end, content } = popupTarget;
  const key = `${NOTE_PATH}:${start}:${end}`;
  const ok = pinExcerpt(key, start, end, content, text);
  if (!ok) return;

  popupTarget = null;
  popupDragPos = null;
  setFocusPlace("note");
  renderAll();
  toast("已添加到输入框（焦点留在笔记）");
}

function pinExcerpt(key, start, end, content, instruction) {
  const existing = pinned.find((p) => p.key === key);
  if (existing) {
    // 同一选区再点批注并完成时，用新指令覆盖更新
    if (instruction) existing.instruction = instruction;
    return true;
  }
  if (pinned.length >= MAX_PINNED) {
    toast(`You can attach up to ${MAX_PINNED} selections.`);
    return false;
  }
  pinned.push({ id: uid(), key, start, end, content, instruction });
  return true;
}

/* ---------------- 右侧 Agent Chat 渲染 ---------------- */
function buildIssue3Xml(excerpts, userText) {
  const units = excerpts.map((e, i) => {
    const id = i + 1;
    let out = `<excerpt id="${id}" path="${NOTE_PATH}" lines="${e.start}-${e.end}">\n${e.content}\n</excerpt>`;
    if (e.instruction) {
      out += `\n<instruction id="${id}">${e.instruction}</instruction>`;
    }
    return out;
  });
  const parts = [];
  if (units.length) parts.push(`<copilot-context>\n${units.join("\n\n")}\n</copilot-context>`);
  if (userText) parts.push(`<user-message>\n${userText}\n</user-message>`);
  return parts.join("\n\n");
}

function renderBadges() {
  const row = $("#composer-badges");
  row.innerHTML = "";

  if (includeActiveNote) {
    const b = document.createElement("div");
    b.className = "ctx-badge";
    b.title = NOTE_PATH;
    b.innerHTML =
      `<span class="icon-slot"><span class="icon-glyph">${SVG.file}</span><span class="rm-x" title="Remove">${SVG.x12}</span></span>` +
      `<span class="b-content">${esc(NOTE_TITLE)}</span>` +
      `<span class="b-faint">Current</span>`;
    b.querySelector(".rm-x").addEventListener("click", (e) => {
      e.stopPropagation();
      includeActiveNote = false;
      renderBadges();
    });
    row.appendChild(b);
  }

  // 徽章样式与 tooltip 保持现有完全一致：无批注图标、无批注预览、点击无响应
  for (const item of pinned) {
    const loc = locLabel(item.start, item.end);
    const b = document.createElement("div");
    b.className = "ctx-badge";
    b.title = `${item.content}\n${NOTE_PATH} (${loc})`;
    b.innerHTML =
      `<span class="icon-slot"><span class="icon-glyph">${SVG.textSelect}</span><span class="rm-x" title="Remove">${SVG.x12}</span></span>` +
      `<span class="b-content">${esc(collapse(item.content))}</span>` +
      `<span class="b-faint">${esc(loc)}</span>`;
    b.querySelector(".rm-x").addEventListener("click", (e) => {
      e.stopPropagation();
      pinned = pinned.filter((x) => x.id !== item.id);
      renderBadges();
      updateSend();
    });
    row.appendChild(b);
  }
}

function renderAgentMessages() {
  const list = $("#agent-messages");
  list.innerHTML = "";
  for (const m of sentMessages) {
    if (m.role === "assistant") {
      const div = document.createElement("div");
      div.className = "agent-assistant-msg";
      div.innerHTML =
        `<div>${esc(m.text).replace(/\n/g, "<br>")}</div>` +
        `<div class="agent-worked-row"><span>Worked for 39s</span><span></span></div>`;
      list.appendChild(div);
    } else {
      const div = document.createElement("div");
      div.className = "agent-user-msg";
      let badges = '<div class="badge-list">';
      for (const e of m.excerpts) {
        const loc = locLabel(e.start, e.end);
        badges += `<div class="ctx-badge" title="${esc(e.content + "\n" + NOTE_PATH + " (" + loc + ")")}"><span class="icon-slot">${SVG.textSelect}</span><span class="b-content">${esc(collapse(e.content))}</span><span class="b-faint">${esc(loc)}</span></div>`;
      }
      badges += "</div>";
      div.innerHTML =
        (m.excerpts.length ? badges : "") +
        (m.text ? `<div>${esc(m.text)}</div>` : "") +
        `<details class="xml-preview"><summary>底层发送内容（仅演示可见）</summary><pre>${esc(buildIssue3Xml(m.excerpts, m.text))}</pre></details>`;
      list.appendChild(div);
    }
  }
  list.scrollTop = list.scrollHeight;
}

function canSend() {
  if (chatDraft.trim().length > 0) return true;
  return pinned.some((p) => p.instruction.trim().length > 0);
}

function updateSend() {
  $("#chat-send").disabled = !canSend();
}

function sendChat() {
  if (!canSend()) return;
  const excerpts = pinned.map((p) => ({ ...p }));
  const text = chatDraft.trim();
  const instCount = excerpts.filter((e) => e.instruction).length;
  sentMessages.push({ id: uid(), role: "user", excerpts, text });
  sentMessages.push({
    id: uid(),
    role: "assistant",
    text: `收到 ${excerpts.length} 处引用${instCount ? `（其中 ${instCount} 处附带 instruction）` : ""}。`,
  });
  pinned = [];
  chatDraft = "";
  $("#chat-input").value = "";
  renderAll();
}

/* ---------------- 事件绑定 ---------------- */
const scroller = $("#cm-scroller");

scroller.addEventListener("mousedown", (e) => {
  const row = e.target.closest(".cm-line");
  setFocusPlace("note");
  if (popupTarget) {
    popupTarget = null;
    popupDragPos = null;
  }
  if (!row) {
    liveSel = null;
    anchorLine = null;
    renderAll();
    return;
  }
  e.preventDefault();
  draggingSel = true;
  const n = Number(row.dataset.line);
  anchorLine = n;
  liveSel = { start: n, end: n };
  renderLines();
  renderToolbar();
  renderPopupOverlay();
});

scroller.addEventListener("mouseover", (e) => {
  if (!draggingSel) return;
  const row = e.target.closest(".cm-line");
  if (!row) return;
  const n = Number(row.dataset.line);
  const s = Math.min(anchorLine, n);
  const end = Math.max(anchorLine, n);
  if (liveSel && liveSel.start === s && liveSel.end === end) return;
  liveSel = { start: s, end };
  renderLines();
});

document.addEventListener("mouseup", () => {
  if (!draggingSel) return;
  draggingSel = false;
  renderToolbar();
});

scroller.addEventListener("scroll", () => {
  if (!popupDragPos) renderPopupOverlay();
  renderToolbar();
});

$("#chat-input").addEventListener("focus", () => setFocusPlace("chat"));
$("#chat-input").addEventListener("input", (e) => {
  chatDraft = e.target.value;
  updateSend();
});
$("#chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});
$("#chat-send").addEventListener("click", sendChat);

$("#view-anno").addEventListener("click", () => {
  popupMode = "annotate";
  popupDragPos = null;
  if (!popupTarget) popupTarget = { start: 225, end: 226, content: contentFor(225, 226), draft: "" };
  $("#view-anno").classList.add("active");
  $("#view-qa").classList.remove("active");
  renderAll();
});

$("#view-qa").addEventListener("click", () => {
  popupMode = "quick-ask";
  popupDragPos = null;
  if (!popupTarget) popupTarget = { start: 225, end: 226, content: contentFor(225, 226), draft: "" };
  $("#view-qa").classList.add("active");
  $("#view-anno").classList.remove("active");
  renderAll();
});

function setButtonStyle(style) {
  buttonStyle = style;
  $("#btn-style-bordered").classList.toggle("active", style === "bordered");
  $("#btn-style-ghost").classList.toggle("active", style === "ghost");
  $("#btn-style-keycap").classList.toggle("active", style === "keycap");
  renderPopupOverlay();
}
$("#btn-style-bordered").addEventListener("click", () => setButtonStyle("bordered"));
$("#btn-style-ghost").addEventListener("click", () => setButtonStyle("ghost"));
$("#btn-style-keycap").addEventListener("click", () => setButtonStyle("keycap"));

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  $("#th-parchment").classList.toggle("active", theme === "parchment");
  $("#th-light").classList.toggle("active", theme === "light");
  $("#th-dark").classList.toggle("active", theme === "dark");
}
$("#th-parchment").addEventListener("click", () => setTheme("parchment"));
$("#th-light").addEventListener("click", () => setTheme("light"));
$("#th-dark").addEventListener("click", () => setTheme("dark"));

$("#reopen-demo").addEventListener("click", () => {
  popupMode = "annotate";
  $("#view-anno").classList.add("active");
  $("#view-qa").classList.remove("active");
  popupDragPos = null;
  popupTarget = { start: 225, end: 226, content: contentFor(225, 226), draft: "" };
  setFocusPlace("popup");
  renderAll();
});

$("#reset-demo").addEventListener("click", () => {
  popupMode = "annotate";
  $("#view-anno").classList.add("active");
  $("#view-qa").classList.remove("active");
  initDemo();
  $("#chat-input").value = "";
  renderAll();
  toast("已重置演示");
});

function renderAll() {
  renderLines();
  renderToolbar();
  renderPopupOverlay();
  renderBadges();
  renderAgentMessages();
  updateSend();
}

initDemo();
renderAll();
</script>
